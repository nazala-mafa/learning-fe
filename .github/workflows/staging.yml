name: Build and Deploy

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Extract metadata untuk image tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build dan push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NUXT_PUBLIC_APP_URL=${{ secrets.APP_URL }}
            NUXT_PUBLIC_UPLOAD_CHUNK_SIZE_MB=5
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ke VPS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy via SSH  
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          debug: true
          script: |
            echo "Connected!"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} \
              --password-stdin

            docker pull ghcr.io/${{ github.repository }}:latest

            docker stop learning-fe || true
            docker rm learning-fe || true

            docker run -d \
              --name learning-fe \
              --network traefik \
              --label traefik.enable=true \
              --label traefik.docker.network=traefik \
              --label "traefik.http.routers.learningFe.entrypoints=web,websecure" \
              --label "traefik.http.routers.learningFe.rule=Host(\`${{ secrets.BASE_URL }}\`) || Host(\`www.${{ secrets.BASE_URL }}\`)" \
              --label traefik.http.routers.learningFe.tls=true \
              --label traefik.http.routers.learningFe.tls.certresolver=letsencrypt \
              --label traefik.http.services.learningFe.loadbalancer.server.port=3000 \
              --env-file /opt/docker/learning/.env.docker \
              --restart unless-stopped \
              ghcr.io/${{ github.repository }}:latest

            docker image prune -f